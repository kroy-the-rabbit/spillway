apiVersion: v2
name: spillway
description: >
  Replicates Kubernetes Secrets and ConfigMaps across namespaces in near real
  time using source annotations or SpillwayProfile resources.
type: application
version: 1.0.0-rc.1
appVersion: "1.0.0-rc.1"
keywords:
  - kubernetes
  - secrets
  - configmaps
  - replication
  - controller
icon: https://raw.githubusercontent.com/kroy-the-rabbit/spillway/main/icon.svg
home: https://spillway.kroy.io
sources:
  - https://github.com/kroy-the-rabbit/spillway
maintainers:
  - name: kroy
    email: kroy@kroy.io
annotations:
  artifacthub.io/category: security
  artifacthub.io/displayName: Spillway
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Website
      url: https://spillway.kroy.io
    - name: Source
      url: https://github.com/kroy-the-rabbit/spillway
  artifacthub.io/changes: |
    - kind: added
      description: "SpillwayProfile served at spillway.kroy.io/v1 (storage); v1alpha1 stays served with a deprecation warning"
    - kind: added
      description: "hack/migrate-storage-version.sh rewrites stored profiles at v1 and trims CRD storedVersions"
    - kind: added
      description: "1.x compatibility promise for annotations, CRD v1, flags, Helm values, replica markers and metrics"
    - kind: changed
      description: "Documentation site rebuilt with Material for MkDocs"
  artifacthub.io/maintainers: |
    - name: kroy
      email: kroy@kroy.io
