apiVersion: v2
name: spillway
description: >
  Replicates Kubernetes Secrets and ConfigMaps across namespaces in near real
  time using source annotations or SpillwayProfile resources.
type: application
version: 0.6.0
appVersion: "0.6.0"
keywords:
  - kubernetes
  - secrets
  - configmaps
  - replication
  - controller
icon: https://raw.githubusercontent.com/kroy-the-rabbit/spillway/main/icon.svg
home: https://spillway.kroy.io
sources:
  - https://github.com/kroy-the-rabbit/spillway
maintainers:
  - name: kroy
    email: kroy@kroy.io
annotations:
  artifacthub.io/category: security
  artifacthub.io/displayName: Spillway
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Website
      url: https://spillway.kroy.io
    - name: Source
      url: https://github.com/kroy-the-rabbit/spillway
  artifacthub.io/changes: |
    - kind: added
      description: "Container image, Helm chart and checksums are signed with Sigstore cosign (keyless); SPDX SBOMs attached to releases and attested on the image"
    - kind: changed
      description: "SpillwayProfile CRD and DeepCopy are generated by controller-gen; CRD gains the swp short name and CEL validation of targetSelector operators"
    - kind: added
      description: "CHANGELOG.md and make bump single-writer versioning"
  artifacthub.io/maintainers: |
    - name: kroy
      email: kroy@kroy.io
