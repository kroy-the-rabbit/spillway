name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ghcr.io/kroy-the-rabbit/spillway
      CHART_OCI_REPO: oci://ghcr.io/kroy-the-rabbit/charts
      CHART_PACKAGE_REPO: ghcr.io/kroy-the-rabbit/charts/spillway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set release variables
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Validate semver tag and chart versions
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          chart_version="$(awk '/^version:/{print $2}' charts/spillway/Chart.yaml)"
          app_version="$(awk -F'"' '/^appVersion:/{print $2}' charts/spillway/Chart.yaml)"
          test "$chart_version" = "$VERSION"
          test "$app_version" = "$VERSION"

      - name: Run tests
        run: go test ./...

      # Runs before any build output exists so the source SBOM reflects the
      # source tree only (not the dist/ binaries and tarballs).
      - name: Generate source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          artifact-name: spillway_${{ steps.vars.outputs.version }}_source_sbom.spdx.json
          output-file: ${{ runner.temp }}/spillway_${{ steps.vars.outputs.version }}_source_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build Linux binaries
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            out="spillway_${{ steps.vars.outputs.version }}_linux_${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.version=${{ steps.vars.outputs.tag }}" \
              -o "dist/${out}/spillway" ./cmd/spillway
            tar -C "dist/${out}" -czf "dist/${out}.tar.gz" spillway
            rm -rf "dist/${out}"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          mv "${RUNNER_TEMP}/spillway_${{ steps.vars.outputs.version }}_source_sbom.spdx.json" dist/

      - name: Sign checksums (keyless)
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.vars.outputs.major_minor }},enable=${{ steps.vars.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.vars.outputs.major }},enable=${{ steps.vars.outputs.is_prerelease == 'false' }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign container image (keyless, by digest)
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${IMAGE_REPO}@${IMAGE_DIGEST}"

      # syft is given the pushed multi-arch index by digest; SYFT_PLATFORM
      # selects the per-platform manifest. registry-username forces the
      # registry source (bypassing the Docker daemon) so platform selection is honoured.
      - name: Generate image SBOM (linux/amd64)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: spillway_${{ steps.vars.outputs.version }}_linux_amd64_sbom.spdx.json
          output-file: dist/spillway_${{ steps.vars.outputs.version }}_linux_amd64_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image SBOM (linux/arm64)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_PLATFORM: linux/arm64
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: spillway_${{ steps.vars.outputs.version }}_linux_arm64_sbom.spdx.json
          output-file: dist/spillway_${{ steps.vars.outputs.version }}_linux_arm64_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image SBOMs (keyless, by digest)
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            sbom="dist/spillway_${VERSION}_linux_${arch}_sbom.spdx.json"
            test -s "$sbom"
            cosign attest --yes --type spdxjson --predicate "$sbom" "${IMAGE_REPO}@${IMAGE_DIGEST}"
          done

      - name: Package and push Helm chart (OCI)
        id: chart
        shell: bash
        run: |
          mkdir -p dist
          helm lint charts/spillway
          helm package charts/spillway --destination dist
          helm push "dist/spillway-${{ steps.vars.outputs.version }}.tgz" "${{ env.CHART_OCI_REPO }}" | tee push.log
          digest="$(awk '/^Digest:/{print $2}' push.log)"
          rm -f push.log
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart (keyless, by digest)
        shell: bash
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          [[ "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${CHART_PACKAGE_REPO}@${CHART_DIGEST}"

      - name: Setup oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Push ArtifactHub repo metadata (OCI)
        continue-on-error: true
        shell: bash
        run: |
          oras push "${{ env.CHART_PACKAGE_REPO }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/*_sbom.spdx.json
